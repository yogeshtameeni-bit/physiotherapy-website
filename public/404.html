<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading application</title>
    <script>
      const basePath = "/physiotherapy-website";
      const requestedPath = window.location.pathname.startsWith(basePath)
        ? window.location.pathname.slice(basePath.length) || "/"
        : "/";
      const requestedLocation = requestedPath + window.location.search + window.location.hash;

      window.location.replace(
        `${basePath}/?redirect=${encodeURIComponent(requestedLocation)}`,
      );
    </script>
  </head>
  <body>
    <p>Redirecting to the dashboard…</p>
  </body>
</html>
